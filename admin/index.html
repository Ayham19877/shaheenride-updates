<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم تكسي شاهين 🚕</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
header{background:linear-gradient(135deg,#1a1a1a,#2a2a2a);padding:20px;text-align:center;border-bottom:3px solid #D4AF37}
header h1{color:#D4AF37;font-size:24px}
header p{color:#888;font-size:14px;margin-top:5px}
.tabs{display:flex;justify-content:center;gap:10px;padding:20px;flex-wrap:wrap}
.tab{background:#1a1a1a;border:2px solid #333;color:#fff;padding:12px 24px;border-radius:12px;cursor:pointer;font-size:16px;transition:all .3s}
.tab.active{background:#D4AF37;color:#000;border-color:#D4AF37;font-weight:bold}
.tab:hover{border-color:#D4AF37}
.content{max-width:900px;margin:0 auto;padding:0 20px 40px}
.panel{display:none}
.panel.active{display:block}
.card{background:#161616;border:1px solid #333;border-radius:16px;padding:20px;margin-bottom:20px}
.card h2{color:#D4AF37;margin-bottom:15px;font-size:18px}
.fare-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:center;margin-bottom:12px;padding:10px;background:#1a1a1a;border-radius:10px}
.fare-row label{color:#D4AF37;font-weight:bold}
.fare-row input{background:#0a0a0a;border:1px solid #444;color:#fff;padding:10px;border-radius:8px;font-size:16px;width:100%;text-align:center}
.fare-row input:focus{border-color:#D4AF37;outline:none}
.btn{background:#D4AF37;color:#000;border:none;padding:14px 30px;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px;transition:all .3s}
.btn:hover{background:#e5c158}
.btn.danger{background:#d32f2f;color:#fff}
.btn.success{background:#4CAF50;color:#fff}
.btn.small{width:auto;padding:8px 20px;font-size:14px;margin:5px}
.status{text-align:center;padding:10px;margin:10px 0;border-radius:8px;display:none}
.status.ok{display:block;background:#1b4d1b;color:#7bff7b}
.status.err{display:block;background:#4d1b1b;color:#ff7b7b}
.promo-item{background:#1a1a1a;border:1px solid #444;border-radius:12px;padding:15px;margin-bottom:12px}
.promo-item input,.promo-item textarea{width:100%;background:#0a0a0a;border:1px solid #444;color:#fff;padding:10px;border-radius:8px;margin:5px 0;font-size:14px}
.promo-item textarea{min-height:80px;resize:vertical}
.driver-card{background:#1a1a1a;border:2px solid #444;border-radius:16px;padding:20px;margin-bottom:15px}
.driver-card.pending{border-color:#D4AF37}
.driver-card.approved{border-color:#4CAF50}
.driver-card.rejected{border-color:#d32f2f;opacity:.7}
.driver-card h3{color:#D4AF37;margin-bottom:10px}
.driver-card .info{color:#ccc;font-size:14px;line-height:1.8}
.driver-card .photos{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}
.driver-card .photos img{width:120px;height:120px;object-fit:cover;border-radius:10px;border:2px solid #444;cursor:pointer}
.driver-card .actions{display:flex;gap:10px;margin-top:10px}
.config-row{display:flex;gap:10px;align-items:center;margin-bottom:15px}
.config-row input{flex:1;background:#0a0a0a;border:1px solid #444;color:#fff;padding:12px;border-radius:8px;font-size:14px;direction:ltr}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.badge.pending{background:#D4AF37;color:#000}
.badge.approved{background:#4CAF50;color:#fff}
.badge.rejected{background:#d32f2f;color:#fff}
</style>
</head>
<body>
<header>
<h1>🚕 لوحة تحكم تكسي شاهين</h1>
<p>Shaheen Ride Admin Panel</p>
</header>

<div class="content" style="padding-top:20px">
<div class="card">
<h2>🔗 إعدادات الاتصال</h2>
<div class="config-row">
<input type="text" id="fbUrl" placeholder="Firebase URL" dir="ltr">
<button class="btn small" onclick="saveConfig()">حفظ</button>
</div>
<div class="config-row">
<input type="email" id="adminEmail" placeholder="بريد الإشعارات" dir="ltr">
<button class="btn small" onclick="saveEmail()">حفظ</button>
</div>
</div>
</div>

<div class="tabs">
<button class="tab active" onclick="showTab('fares')">💰 الأسعار</button>
<button class="tab" onclick="showTab('promos')">🎁 العروض</button>
<button class="tab" onclick="showTab('drivers')">👨‍✈️ طلبات السائقين</button>
<button class="tab" onclick="showTab('monitor')">🗺️ مراقبة السائقين</button>
</div>

<div class="content">
<div class="status" id="status"></div>

<!-- Fares Panel -->
<div class="panel active" id="panel-fares">
<div class="card">
<h2>💰 أسعار الرحلات (ليرة سورية)</h2>
<div id="faresList"></div>
<button class="btn" onclick="saveFares()">💾 حفظ الأسعار</button>
</div>
</div>

<!-- Promotions Panel -->
<div class="panel" id="panel-promos">
<div class="card">
<h2>🎁 العروض والترويج</h2>
<div id="promosList"></div>
<button class="btn small" onclick="addPromo()">➕ إضافة عرض</button>
<button class="btn" onclick="savePromos()">💾 حفظ العروض</button>
</div>
</div>

<!-- Drivers Panel -->
<div class="panel" id="panel-drivers">
<div class="card">
<h2>👨‍✈️ طلبات تسجيل السائقين</h2>
<div id="driversList"><p style="color:#888;text-align:center">جاري التحميل...</p></div>
<button class="btn small" onclick="loadDrivers()">🔄 تحديث</button>
</div>
</div>

<!-- Monitor Panel -->
<div class="panel" id="panel-monitor">
<div class="card">
<h2>🗺️ مراقبة السائقين المتصلين</h2>
<div id="monitorList"><p style="color:#888;text-align:center">جاري التحميل...</p></div>
<button class="btn small" onclick="loadMonitor()">🔄 تحديث</button>
</div>
<div class="card">
<h2>🚕 الرحلات النشطة</h2>
<div id="ridesList"><p style="color:#888;text-align:center">جاري التحميل...</p></div>
<button class="btn small" onclick="loadRides()">🔄 تحديث</button>
</div>
</div>
</div>

<script>
let FB = localStorage.getItem('sr_fb') || 'https://shaheen-ride-default-rtdb.europe-west1.firebasedatabase.app/shahinride';
document.getElementById('fbUrl').value = FB;
document.getElementById('adminEmail').value = localStorage.getItem('sr_email') || '';

function saveConfig(){ FB = document.getElementById('fbUrl').value.trim().replace(/\/$/,''); localStorage.setItem('sr_fb', FB); showStatus('تم حفظ الرابط ✅','ok'); }
function saveEmail(){ localStorage.setItem('sr_email', document.getElementById('adminEmail').value.trim()); showStatus('تم حفظ البريد ✅','ok'); }
function showStatus(msg, type){ const s=document.getElementById('status'); s.textContent=msg; s.className='status '+type; setTimeout(()=>s.className='status',3000); }
function showTab(name){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active')); event.target.classList.add('active'); document.getElementById('panel-'+name).classList.add('active'); if(name==='drivers') loadDrivers(); if(name==='monitor'){ loadMonitor(); loadRides(); } }

const CATS = [
  {id:'economy', ar:'🚗 اقتصادية'},
  {id:'family', ar:'🚐 عائلية'},
  {id:'modern', ar:'🚙 سيارة حديثة'},
  {id:'vip', ar:'✨ فاخرة'}
];
const DEFAULTS = {economy:{base:15000,perKm:6000}, family:{base:22000,perKm:9000}, modern:{base:30000,perKm:12000}, vip:{base:40000,perKm:15000}};

async function loadFares(){
  try{
    const r = await fetch(FB+'/config/fares.json');
    const d = await r.json();
    const box = document.getElementById('faresList'); box.innerHTML='';
    CATS.forEach(c=>{
      const v = (d && d[c.id]) || DEFAULTS[c.id];
      box.innerHTML += `<div class="fare-row">
        <label>${c.ar}</label>
        <input type="number" id="base_${c.id}" value="${v.base}" placeholder="الأجرة الأساسية">
        <input type="number" id="km_${c.id}" value="${v.perKm}" placeholder="سعر الكيلومتر">
      </div>`;
    });
  }catch(e){ showStatus('خطأ بجلب الأسعار: '+e.message,'err'); }
}

async function saveFares(){
  const fares = {};
  CATS.forEach(c=>{
    fares[c.id] = {
      base: parseInt(document.getElementById('base_'+c.id).value)||0,
      perKm: parseInt(document.getElementById('km_'+c.id).value)||0
    };
  });
  try{
    const r = await fetch(FB+'/config/fares.json',{method:'PUT',body:JSON.stringify(fares),headers:{'Content-Type':'application/json'}});
    if(r.ok) showStatus('تم حفظ الأسعار ✅','ok'); else showStatus('فشل الحفظ','err');
  }catch(e){ showStatus('خطأ: '+e.message,'err'); }
}

let promos = [];
async function loadPromos(){
  try{
    const r = await fetch(FB+'/config/promotions.json');
    const d = await r.json();
    promos = Array.isArray(d) ? d : (d ? Object.values(d) : []);
    renderPromos();
  }catch(e){ showStatus('خطأ بجلب العروض','err'); }
}
function renderPromos(){
  const box = document.getElementById('promosList'); box.innerHTML='';
  promos.forEach((p,i)=>{
    box.innerHTML += `<div class="promo-item">
      <input value="${p.title||''}" placeholder="العنوان" onchange="promos[${i}].title=this.value">
      <textarea placeholder="الوصف" onchange="promos[${i}].desc=this.value">${p.desc||''}</textarea>
      <input value="${p.image||''}" placeholder="رابط الصورة (اختياري)" dir="ltr" onchange="promos[${i}].image=this.value">
      <button class="btn small danger" onclick="promos.splice(${i},1);renderPromos()">🗑 حذف</button>
    </div>`;
  });
}
function addPromo(){ promos.push({title:'',desc:'',image:''}); renderPromos(); }
async function savePromos(){
  try{
    const r = await fetch(FB+'/config/promotions.json',{method:'PUT',body:JSON.stringify(promos),headers:{'Content-Type':'application/json'}});
    if(r.ok) showStatus('تم حفظ العروض ✅','ok'); else showStatus('فشل الحفظ','err');
  }catch(e){ showStatus('خطأ: '+e.message,'err'); }
}

async function loadDrivers(){
  const box = document.getElementById('driversList');
  box.innerHTML = '<p style="color:#888;text-align:center">جاري التحميل...</p>';
  try{
    const r = await fetch(FB+'/driver_applications.json');
    const d = await r.json();
    if(!d){ box.innerHTML='<p style="color:#888;text-align:center">لا توجد طلبات</p>'; return; }
    box.innerHTML='';
    Object.keys(d).reverse().forEach(id=>{
      const a = d[id];
      const st = a.status || 'pending';
      const badge = st==='pending' ? '<span class="badge pending">⏳ بانتظار</span>' : st==='approved' ? '<span class="badge approved">✅ مقبول</span>' : '<span class="badge rejected">❌ مرفوض</span>';
      let photos = '';
      ['photo','license','idcard','carphoto'].forEach(k=>{
        if(a[k]) photos += `<img src="${a[k]}" onclick="window.open('${a[k]}')" title="${k}">`;
      });
      box.innerHTML += `<div class="driver-card ${st}">
        <h3>${a.name||'?'} ${badge}</h3>
        <div class="info">
        📱 ${a.phone||'?'}<br>
        🚗 ${a.carType||''} ${a.carModel||''} ${a.carYear||''}<br>
        🎨 ${a.carColor||''} | 🔢 ${a.plate||''}<br>
        📍 ${a.city||''}<br>
        🕐 ${a.createdAt ? new Date(a.createdAt).toLocaleString('ar') : ''}
        </div>
        <div class="photos">${photos}</div>
        ${st==='pending' ? `<div class="actions">
          <button class="btn small success" onclick="setDriverStatus('${id}','approved')">✅ قبول</button>
          <button class="btn small danger" onclick="setDriverStatus('${id}','rejected')">❌ رفض</button>
        </div>` : ''}
      </div>`;
    });
  }catch(e){ box.innerHTML='<p style="color:#f77">خطأ: '+e.message+'</p>'; }
}

async function setDriverStatus(id, status){
  try{
    await fetch(FB+'/driver_applications/'+id+'/status.json',{method:'PUT',body:JSON.stringify(status)});
    // Also update the driver's record if approved
    if(status==='approved'){
      const r = await fetch(FB+'/driver_applications/'+id+'.json');
      const a = await r.json();
      if(a && a.driverId){
        await fetch(FB+'/drivers/'+a.driverId+'/approved.json',{method:'PUT',body:'true'});
      }
    }
    showStatus(status==='approved' ? 'تم قبول السائق ✅' : 'تم رفض السائق','ok');
    loadDrivers();
  }catch(e){ showStatus('خطأ: '+e.message,'err'); }
}

// Init
loadFares();
loadPromos();

async function loadMonitor(){
  const box = document.getElementById('monitorList');
  box.innerHTML = '<p style="color:#888;text-align:center">جاري التحميل...</p>';
  try{
    const r = await fetch(FB+'/drivers.json');
    const d = await r.json();
    if(!d){ box.innerHTML='<p style="color:#888;text-align:center">لا يوجد سائقون</p>'; return; }
    const now = Date.now();
    box.innerHTML='';
    let count = 0;
    Object.keys(d).forEach(id=>{
      const v = d[id];
      if(!v.online) return;
      const age = Math.round((now - (v.updatedAt||0))/1000);
      if(age > 120) return; // stale
      count++;
      box.innerHTML += `<div class="driver-card">
        <h3>🚕 ${v.name||id}</h3>
        <div class="info">
        📱 ${v.phone||'?'}<br>
        🚗 ${v.car||''} ${v.color||''} | 🔢 ${v.plate||''}<br>
        📍 ${v.city||''} | ⭐ ${v.rating||5} (${v.trips||0} رحلة)<br>
        📡 آخر تحديث: منذ ${age} ثانية<br>
        🗺️ <a href="https://www.google.com/maps?q=${v.lat},${v.lon}" target="_blank" style="color:#D4AF37">عرض على الخريطة</a>
        </div>
      </div>`;
    });
    if(count===0) box.innerHTML='<p style="color:#888;text-align:center">لا يوجد سائقون متصلون الآن</p>';
  }catch(e){ box.innerHTML='<p style="color:#f77">خطأ: '+e.message+'</p>'; }
}
// Auto-refresh monitor every 30s when visible
setInterval(()=>{ if(document.getElementById('panel-monitor').classList.contains('active')){ loadMonitor(); loadRides(); } }, 30000);

async function loadRides(){
  const box = document.getElementById('ridesList');
  box.innerHTML = '<p style="color:#888;text-align:center">جاري التحميل...</p>';
  try{
    const r = await fetch(FB+'/rides.json?orderBy="createdAt"&limitToLast=20');
    const d = await r.json();
    if(!d){ box.innerHTML='<p style="color:#888;text-align:center">لا توجد رحلات</p>'; return; }
    box.innerHTML='';
    const statusAr = {searching:'🔍 يبحث عن سائق', accepted:'✅ مقبولة', arriving:'🚗 السائق قادم', ontrip:'🛣️ بالطريق', completed:'✅ مكتملة', cancelled:'❌ ملغية'};
    Object.keys(d).reverse().forEach(id=>{
      const v = d[id];
      const st = statusAr[v.status] || v.status;
      box.innerHTML += `<div class="driver-card">
        <h3>🧾 ${id.substring(0,20)}... <span class="badge ${v.status==='completed'?'approved':v.status==='cancelled'?'rejected':'pending'}">${st}</span></h3>
        <div class="info">
        👤 ${v.riderName||'?'} 📱 ${v.riderPhone||''}<br>
        💰 ${v.fare||0} ل.س | 🏷️ ${v.category||''} | 📍 ${v.city||''}<br>
        🚕 السائق: ${v.driverId||'لم يُعيَّن بعد'}<br>
        🕐 ${v.createdAt ? new Date(v.createdAt).toLocaleString('ar') : ''}
        ${v.pickup ? `<br>📍 <a href="https://www.google.com/maps?q=${v.pickup.lat},${v.pickup.lon}" target="_blank" style="color:#D4AF37">نقطة الانطلاق</a>` : ''}
        ${v.dest ? ` | 🎯 <a href="https://www.google.com/maps?q=${v.dest.lat},${v.dest.lon}" target="_blank" style="color:#D4AF37">الوجهة</a>` : ''}
        </div>
      </div>`;
    });
  }catch(e){ box.innerHTML='<p style="color:#f77">خطأ: '+e.message+'</p>'; }
}
</script>
</body>
</html>
